# =============================================================================
# kube-prometheus-stack values for the Biopay dev cluster.
#
# Lean settings for a portfolio demo on 2x t3.medium nodes (~6 GiB total
# pod RAM available). For prod, raise retention, switch storage to gp3
# with KMS encryption, scale Prometheus to HA, and enable Thanos sidecar.
# =============================================================================

fullnameOverride: kps

# -----------------------------------------------------------------------------
# Alertmanager — disabled for the demo (no paging target wired yet, would
# just consume RAM). Enabled in prod with SNS/PagerDuty integration.
# -----------------------------------------------------------------------------
alertmanager:
  enabled: false

# -----------------------------------------------------------------------------
# Grafana — keep on, expose via port-forward in dev. ALB ingress in prod.
# -----------------------------------------------------------------------------
grafana:
  enabled: true
  adminPassword: "biopay-demo"
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: false # demo only — persistence handled by Prometheus side
  defaultDashboardsTimezone: utc

# -----------------------------------------------------------------------------
# Prometheus — short retention, small disk, modest resources.
# -----------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 1d
    retentionSize: ""
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

# -----------------------------------------------------------------------------
# Prometheus Operator — defaults are fine.
# -----------------------------------------------------------------------------
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi

# -----------------------------------------------------------------------------
# kube-state-metrics — defaults are fine.
# -----------------------------------------------------------------------------
kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi

# -----------------------------------------------------------------------------
# node-exporter — defaults are fine; runs as DaemonSet on every node.
# -----------------------------------------------------------------------------
prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
